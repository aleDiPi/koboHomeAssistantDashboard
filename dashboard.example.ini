# Configurazione della dashboard.
# Copia questo file come "dashboard.ini" nella stessa cartella del programma.
# Dopo ogni modifica riavvia la dashboard (non serve ricompilare).

[homeassistant]
url = http://homeassistant.local:8123
# Token di accesso a lunga durata (Profilo > Sicurezza in Home Assistant).
# Non condividerlo e non salvarlo nel repository.
token =

[display]
# portrait, portrait_inverted, landscape, landscape_inverted
# landscape = porta USB a destra
orientation = landscape
# auto, 0, 90, 180, 270: da cambiare solo se l'immagine appare ruotata
screen_rotation = auto
# aggiornamento completo (lampeggio) contro gli aloni; 0 per disattivarlo
full_refresh_every = 30m
timezone = Europe/Rome

[touch]
# Valori per il Kobo Glo: cambiarli solo se i tocchi finiscono altrove.
device = /dev/input/event1
swap_xy = true
mirror_x = true
mirror_y = false

# Una riga per entità: entity_id = Nome sullo schermo
# Senza "= Nome" viene usato il nome di Home Assistant.
# L'ordine delle righe è l'ordine sullo schermo.

[sensors]
sensor.temperatura_soggiorno = Soggiorno
sensor.temperatura_esterna = Esterno

[lights]
light.cucina = Cucina
light.soggiorno = Soggiorno

[climate]
climate.condizionatore = Condizionatore
