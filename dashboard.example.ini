# Configurazione della dashboard.
# Copia questo file come "dashboard.ini" nella stessa cartella del programma.
# Dopo ogni modifica riavvia la dashboard (non serve ricompilare).

[homeassistant]
url = http://homeassistant.local:8123
# Token di accesso a lunga durata (Profilo > Sicurezza in Home Assistant).
# Non condividerlo e non salvarlo nel repository.
token =

# Dashboard di Home Assistant che definisce le schermate (il suo indirizzo,
# per esempio dashboard-kobo). Vuoto: valgono le liste di questo file.
dashboard = 

[display]
# portrait, portrait_inverted, landscape, landscape_inverted
# landscape = porta USB a destra
orientation = landscape
# auto, 0, 90, 180, 270: da cambiare solo se l'immagine appare ruotata
screen_rotation = auto
# aggiornamento completo (lampeggio) contro gli aloni; 0 per disattivarlo
full_refresh_every = 30m
# torna alla schermata Casa dopo questo tempo senza tocchi; 0 = mai
return_home = 2m
timezone = Europe/Rome

[touch]
# Valori per il Kobo Glo: cambiarli solo se i tocchi finiscono altrove.
device = /dev/input/event1
swap_xy = true
mirror_x = true
mirror_y = false

# Una riga per entità: entity_id = Nome sullo schermo
# Senza "= Nome" viene usato il nome di Home Assistant.
# Per le luci si può forzare l'icona: light.divano = Divano | mdi:floor-lamp
# L'ordine delle righe è l'ordine sullo schermo.

[frontlight]
# Luce dello schermo, in percentuale (0-100). manage = false non la tocca.
manage = true
# dopo il tramonto, se tutte le luci elencate sono spente
night_level = 1
night_when_off = light.scala, light.soggiorno
# dopo il tramonto, per qualche secondo dopo un tocco
touch_level = 15
touch_time = 30s

[notifications]
# Avvisi in alto: compaiono solo quando l'entità è "on" o "open".
binary_sensor.finestra_soggiorno = Finestra sala

[calendar]
# Calendari mostrati nella schermata Casa.
calendar.famiglia = Famiglia

[windows]
# Pagina Clima: i "cover" hanno i pulsanti Apri/Chiudi, i sensori solo lo stato.
cover.lucernario = Lucernario
binary_sensor.finestra_soggiorno = Finestra sala

[actions]
# nome | mdi:icona | minuti (o entità) del conto alla rovescia
script.cambio_aria = Cambio aria | 10

[power]
# Standby: in casa e alimentato resta sempre acceso; in casa a batteria
# dorme e si aggiorna ogni home_refresh; se nessuno è in casa ogni
# away_refresh. Il tasto di accensione lo risveglia.
# Anche da sveglio, a batteria, lascia riposare processore e Wi-Fi.
saving = false
standby = false
presence = person.mario
idle = 2m
home_refresh = 5m
away_refresh = 15m
# Invia a Home Assistant batteria, alimentazione, modalità e luce.
# Alimentato: a ogni cambiamento; a batteria solo ogni report_on_battery.
report = false
report_on_battery = 15m

[standby]
# Immagine (PNG o JPEG, nella cartella del programma) e temperature mostrate
# mentre il Kobo dorme.
picture = standby.jpg
indoor = sensor.temperatura_soggiorno
outdoor = sensor.temperatura_esterna

[sensors]
sensor.temperatura_soggiorno = Soggiorno
sensor.temperatura_esterna = Esterno

[lights]
light.cucina = Cucina
light.soggiorno = Soggiorno

[climate]
climate.condizionatore = Condizionatore
